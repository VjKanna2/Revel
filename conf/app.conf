
package.folders = conf, public, app/views

app.name    = SalesManagement
app.version = 1.0.0

app.secret = DxoWYIHOMh1ZIWDFMHuQ6RMzO93NL79YVzlyE2vwBZ6bgHHjXJg8ZBE5uLhEOmmW

http.addr = 0.0.0.0

# Listening port
http.port = 9000

http.ssl = false

app.behind.proxy = false

http.timeout.read  = 30
http.timeout.write = 30

cookie.prefix = SM

session.expires = 24h

results.chunked = false

# Reduces payload size by ~60-70 %
results.compressed = true

i18n.default_language = en

format.date     = 2006-01-02
format.datetime = 2006-01-02 15:04

module.static = github.com/revel/modules/static


[dev]

mode.dev = true

results.pretty = true

watch      = true
watch.mode = eager

module.testrunner = github.com/revel/modules/testrunner

log.all.filter.module.app = stdout
log.error.nfilter.module.app = stderr
log.crit.output  = stderr
log.request.output = stdout


[prod]

mode.dev = false

results.pretty     = false
results.compressed = true

watch = false

module.testrunner =

log.all.filter.module.app = stdout
log.error.nfilter.module.app = stderr
log.crit.output  = stderr
log.request.output = stdout
